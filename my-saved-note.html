<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes · Kru &amp; Sora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg:     #0a0906;
    --bg2:    #131109;
    --bg3:    #1c1810;
    --gold:   #c8943a;
    --gold2:  #e6b45a;
    --cream:  #f0e8d8;
    --cream2: #d8cdb8;
    --muted:  #7a7060;
    --border: rgba(200,148,58,0.18);
    --eng:    #5a9acc;
    --thai:   #cc5a7a;
    --roman:  #5aaa80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.5;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    padding: 3rem 2rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: radial-gradient(ellipse 80% 100% at 50% 0%, rgba(200,148,58,0.07) 0%, transparent 70%);
    text-align: center;
  }

  .back-link {
    position: absolute;
    top: 1.4rem; left: 1.6rem;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
    color: var(--muted);
    text-decoration: none;
    display: flex; align-items: center; gap: 0.35rem;
    transition: color 0.18s;
  }
  .back-link:hover { color: var(--gold); }

  .page-tag {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--gold);
    border: 1px solid var(--border); padding: 0.3rem 0.9rem;
    border-radius: 2px; margin-bottom: 1.2rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 600; line-height: 1;
    color: var(--cream);
    margin-bottom: 0.5rem;
  }

  .page-sub {
    font-size: 0.82rem; color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── MAIN LAYOUT ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 8rem;
    position: relative; z-index: 1;
  }

  /* ── CONTROLS BAR ── */
  .controls {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.8rem; gap: 1rem; flex-wrap: wrap;
  }

  .count-label {
    font-size: 0.78rem; color: var(--muted); font-weight: 500;
  }

  .count-label strong { color: var(--gold); }

  .clear-btn {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(200,148,58,0.15);
    border-radius: 6px;
    padding: 0.38rem 0.9rem;
    cursor: pointer;
    transition: all 0.18s;
  }
  .clear-btn:hover { border-color: #b83428; color: #e05040; }

  /* ── GROUP HEADER ── */
  .group-header {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--gold);
    padding: 0.3rem 0; margin: 2rem 0 0.8rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  /* ── SAVED CARD ── */
  .saved-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem 1rem;
    margin-bottom: 0.75rem;
    position: relative;
    transition: border-color 0.18s;
  }
  .saved-card:hover { border-color: rgba(200,148,58,0.35); }

  .card-meta {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 0.75rem; flex-wrap: wrap;
  }

  .meta-vol {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
    background: rgba(200,148,58,0.1);
    border: 1px solid rgba(200,148,58,0.2);
    border-radius: 4px; padding: 0.18rem 0.55rem;
  }

  .meta-topic {
    font-size: 0.68rem; color: var(--muted); font-weight: 500;
    letter-spacing: 0.04em;
  }

  .card-eng {
    font-size: 1rem; font-weight: 600;
    color: var(--eng);
    margin-bottom: 0.35rem;
    line-height: 1.4;
  }

  .card-thai {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 1.05rem; font-weight: 400;
    color: var(--thai);
    margin-bottom: 0.3rem;
    line-height: 1.6;
  }

  .card-roman {
    font-size: 0.8rem; color: var(--roman);
    font-style: italic; letter-spacing: 0.02em;
  }

  .remove-btn {
    position: absolute;
    top: 0.85rem; right: 0.9rem;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
  }
  .remove-btn:hover { border-color: rgba(184,52,40,0.4); color: #e05040; background: rgba(184,52,40,0.08); }
  .remove-btn svg { width: 12px; height: 12px; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 5rem 2rem;
  }

  .empty-icon {
    font-size: 3rem; margin-bottom: 1.2rem; opacity: 0.4;
  }

  .empty h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem; font-weight: 600;
    color: var(--cream2); margin-bottom: 0.6rem;
  }

  .empty p {
    font-size: 0.85rem; color: var(--muted);
    line-height: 1.6; max-width: 340px; margin: 0 auto 1.8rem;
  }

  .browse-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
    color: var(--gold);
    border: 1px solid rgba(200,148,58,0.35);
    border-radius: 8px; padding: 0.6rem 1.3rem;
    text-decoration: none;
    transition: all 0.18s;
  }
  .browse-btn:hover { background: rgba(200,148,58,0.08); border-color: var(--gold); }

  /* ── TTS CONTROLS ON SAVED CARD ── */
  .card-actions {
    display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap;
  }

  .speak-btn {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 9px;
    border-radius: 20px; border: 1.5px solid;
    background: transparent; cursor: pointer;
    font-size: 0.68rem; font-weight: 600;
    font-family: 'Outfit', sans-serif; letter-spacing: 0.04em;
    transition: all 0.15s; min-height: 24px;
  }
  .speak-btn.eng { color: var(--eng); border-color: rgba(90,154,204,0.35); }
  .speak-btn.eng:hover { background: rgba(90,154,204,0.1); border-color: var(--eng); }
  .speak-btn.tha { color: var(--thai); border-color: rgba(204,90,122,0.35); }
  .speak-btn.tha:hover { background: rgba(204,90,122,0.1); border-color: var(--thai); }
  .speak-btn.speaking { animation: speakPulse 0.9s ease-in-out infinite; }
  .speak-btn.eng.speaking { background: rgba(90,154,204,0.12); border-color: var(--eng); }
  .speak-btn.tha.speaking { background: rgba(204,90,122,0.12); border-color: var(--thai); }
  .speak-btn svg { width: 10px; height: 10px; flex-shrink: 0; }

  @keyframes speakPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.6; transform: scale(0.95); }
  }

  /* ── VOL LINK ON CARD ── */
  .vol-link {
    font-size: 0.67rem; color: var(--muted);
    text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;
    transition: color 0.15s;
  }
  .vol-link:hover { color: var(--gold); }

  /* ── TOAST ── */
  .bm-toast {
    position: fixed;
    bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--bg3);
    color: rgba(240,232,216,0.9);
    font-size: 0.76rem; font-weight: 500;
    padding: 0.55rem 1.1rem;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.1);
    opacity: 0; transition: all 0.22s;
    pointer-events: none; z-index: 999;
    white-space: nowrap; font-family: 'Outfit', sans-serif;
  }
  .bm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">&#8592; All Volumes</a>
  <div class="page-tag">&#128278; My Notes</div>
  <h1>Saved Cards</h1>
  <p class="page-sub">Words and phrases you bookmarked across all volumes</p>
</header>

<main id="main">
  <!-- rendered by JS -->
</main>

<div id="bmToast" class="bm-toast"></div>

<script>
var BM_KEY = 'kruexchange_saved_cards';
var _speakerSVG = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2V5.5z" fill="currentColor"/><path d="M10.5 5.5c1.1 0.7 1.8 1.9 1.8 3.5s-0.7 2.8-1.8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.5 3.5C14.2 4.7 15.2 6.2 15.2 8s-1 3.3-2.7 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
var _ttsActiveBtn = null;
var _toastTimer = null;

function bmLoad() {
  try { return JSON.parse(localStorage.getItem(BM_KEY) || '[]'); } catch(e) { return []; }
}
function bmWrite(arr) {
  try { localStorage.setItem(BM_KEY, JSON.stringify(arr)); } catch(e) {}
}

function showToast(msg) {
  var t = document.getElementById('bmToast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function speak(text, lang, btn) {
  if (!window.speechSynthesis) return;
  if (_ttsActiveBtn && _ttsActiveBtn !== btn) _ttsActiveBtn.classList.remove('speaking');
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  if (!text) return;
  setTimeout(function() {
    var utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang;
    utt.rate = lang === 'th-TH' ? 0.82 : 0.92;
    var voices = window.speechSynthesis.getVoices();
    var voice = voices.find(function(v){ return v.lang === lang; })
             || voices.find(function(v){ return v.lang.startsWith(lang.split('-')[0]); });
    if (voice) utt.voice = voice;
    _ttsActiveBtn = btn;
    btn.classList.add('speaking');
    utt.onend = function() { btn.classList.remove('speaking'); _ttsActiveBtn = null; };
    utt.onerror = function() { btn.classList.remove('speaking'); _ttsActiveBtn = null; };
    window.speechSynthesis.speak(utt);
  }, 60);
}

function volFileName(vol) {
  if (vol === '1') return 'kru-language-exchange.html';
  return 'kru-exchange-vol' + vol + '.html';
}

function render() {
  var cards = bmLoad();
  var main  = document.getElementById('main');

  if (cards.length === 0) {
    main.innerHTML = '<div class="empty">'
      + '<div class="empty-icon">&#128278;</div>'
      + '<h2>No saved notes yet</h2>'
      + '<p>Bookmark cards from any volume using the &#128278; button on each card.</p>'
      + '<a class="browse-btn" href="index.html">&#8592; Browse Volumes</a>'
      + '</div>';
    return;
  }

  // group by vol
  var groups = {};
  var groupOrder = [];
  cards.forEach(function(c) {
    var key = c.volLabel || ('Vol. ' + c.vol);
    if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
    groups[key].push(c);
  });

  var html = '<div class="controls">'
    + '<p class="count-label"><strong>' + cards.length + '</strong> saved card' + (cards.length !== 1 ? 's' : '') + '</p>'
    + '<button class="clear-btn" id="clearAll">Clear all</button>'
    + '</div>';

  groupOrder.forEach(function(label) {
    var grpCards = groups[label];
    var vol = grpCards[0].vol;
    html += '<div class="group-header">'
      + '<span>' + label + '</span>'
      + '<a class="vol-link" href="' + volFileName(vol) + '">Open volume &#8594;</a>'
      + '</div>';

    grpCards.forEach(function(c) {
      html += '<div class="saved-card" data-id="' + escHtml(c.id) + '">'
        + '<div class="card-meta">'
        +   '<span class="meta-vol">' + escHtml(c.volLabel || 'Vol. '+c.vol) + '</span>'
        +   '<span class="meta-topic">' + escHtml(c.topicLabel || c.topic) + '</span>'
        + '</div>'
        + '<div class="card-eng">'  + escHtml(c.eng)   + '</div>'
        + '<div class="card-thai">' + escHtml(c.thai)  + '</div>'
        + (c.roman ? '<div class="card-roman">' + escHtml(c.roman) + '</div>' : '')
        + '<div class="card-actions">'
        +   '<button class="speak-btn eng" data-text="' + escAttr(c.eng) + '" data-lang="en-GB">' + _speakerSVG + '<span>EN</span></button>'
        +   '<button class="speak-btn tha" data-text="' + escAttr(c.thai) + '" data-lang="th-TH">' + _speakerSVG + '<span>TH</span></button>'
        + '</div>'
        + '<button class="remove-btn" data-id="' + escAttr(c.id) + '" title="Remove">'
        +   '<svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
        + '</button>'
        + '</div>';
    });
  });

  main.innerHTML = html;

  // Clear all
  var clearBtn = document.getElementById('clearAll');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      if (!confirm('Remove all ' + cards.length + ' saved cards?')) return;
      bmWrite([]);
      showToast('All notes cleared');
      render();
    });
  }

  // TTS buttons
  main.querySelectorAll('.speak-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      speak(btn.dataset.text, btn.dataset.lang, btn);
    });
  });

  // Remove buttons
  main.querySelectorAll('.remove-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id  = btn.dataset.id;
      var arr = bmLoad().filter(function(c){ return c.id !== id; });
      bmWrite(arr);
      showToast('Removed from My Notes');
      render();
    });
  });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

// init voices then render
if (window.speechSynthesis) {
  var v = window.speechSynthesis.getVoices();
  if (v.length === 0) window.speechSynthesis.addEventListener('voiceschanged', render, { once: true });
}
render();
</script>
</body>
</html>
